[package]
name = "AstroMFD"
version = "1.0.1"
description = "A space-sim MFD creator"
authors = ["Tyler Snedigar"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "astro_mfd_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11.2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.47.1", features = ["full"] }
include_dir = "0.7.4"
futures-util = { version = "0.3.31", features = ["sink"] }
axum = { version = "0.8.4", features = ["ws", "macros"] }
mime_guess = "2.0.5"
async-trait = "0.1.89"
local-ip-address = "0.6.5"
notify = "8.2.0"
anyhow = "1.0.99"
log4rs = { version = "1.4.0", features = ["file_appender", "console_appender"] }
chrono = "0.4.42"
log = "0.4.28"
regex = "1.11.2"
dirs = "6.0.0"
rodio = "0.22.2"
uuid = { version = "1.18.1", features = ["v4"] }
rfd = "0.15"
tauri-plugin-updater = { version = "2.10.1", optional = true }
tauri-plugin-process = { version = "2.3.1", optional = true }
zip = { version = "8.6.0", features = ["deflate"] }

[features]
default = ["updater"]
updater = ["tauri-plugin-updater", "tauri-plugin-process"]

[target.'cfg(target_os = "windows")'.dependencies]
vjoy = "0.6.0"

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.12"
